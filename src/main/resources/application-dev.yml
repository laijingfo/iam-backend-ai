langchain4j:
  memory:
    knn:
      score-is-distance: true
  open-ai:
    # LangChain4jConfig 的 @Value 读取（starter 自身配置在各模型块下）
    base-url: https://ws-h0yse1g5h37z1f9s.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api-key: sk-ws-H.PIYYERR.1Nwn.MEUCIElKdWigzoNh0Q0oyc4diloh1kPaG985KNHutJFYZ_BcAiEAxSEiKGkUToaPuDQXxyTjjvFHlw-ijplt7phf64Nt6EM
    #    base-url: https://ws-g32z8buv16crgc1y.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    #    api-key: sk-ws-H.PIRLYYH.JPuT.MEUCIQDHb9mXx_Wgp51sbDlNYHkbEcC5tvvj4rf04ZkWpeu4gwIgZrJqfZFtIsri91swwVj16yYY8id-JTc0ov6Fb8d_AgY
    #非流式对话模型
    chat-model:
      model-name: kimi-k2.6
    #文本转向量模型
    embedding-model:
      model-name: text-embedding-v3
      dimension: 1024
    # 流式对话模型
    streaming-chat-model: # ← 新增
      model-name: kimi-k2.6
      temperature: 0.7
  # 传输层（OkHttp）配置，由 LangChain4jConfig 读取
  http:
    # 只走 IPv4。阿里云 MaaS 域名同时下发 A/AAAA 记录，本机无 IPv6 出口时
    # OkHttp 5.x 的 happy-eyeballs 仍会尝试 IPv6，TLS 握手被中间设备 RST，
    # 表现为 SocketException: Connection reset。部署环境有可用 IPv6 时可改为 false。
    ipv4-only: true
    # 单次请求超时（秒）。langchain4j 会把它同时用作 connectTimeout 和 readTimeout，
    # 想让"连不上"类故障更快暴露可调小到 15~20。
    timeout-seconds: 120
    # 失败重试次数（仅非流式模型支持，流式模型无此配置项）
    max-retries: 3
    log-requests: true
    log-responses: true

ai:
  model:
    small: qwen-plus-latest   # 换成真实存在的
    medium: kimi-k2.6
    large: kimi-k2.6
  chat:
    enabled: true
    max-concurrent: 16
    queue-capacity: 100
    keep-alive-seconds: 60
  knowledge-router:
    refresh-minutes: 10
    retry-backoff-millis: 60000

token:
  enabled: true
  default-tier: FREE
  max-prompt-tokens: 6000
  context-reserve-ratio: 0.2

  # 估算器选择：heuristic（默认，零依赖）| tiktoken（精确，需 jtokkit）
  estimator:
    type: heuristic
    # type: tiktoken      # 取消注释即启用精确估算

  cost:
    kimi-k2.6:         { input: 0.012,  output: 0.012 }
    qwen-turbo:        { input: 0.0003, output: 0.0006 }
    qwen-plus:         { input: 0.0008, output: 0.002 }
    qwen-max:          { input: 0.02,   output: 0.06 }
    text-embedding-v3: { input: 0.0007, output: 0.0 }

  quota:
    FREE:    { daily: 500000,   monthly: 5000000,   max-request: 8000 }
    BASIC:   { daily: 2000000,  monthly: 20000000,  max-request: 12000 }
    PREMIUM: { daily: 10000000, monthly: 100000000, max-request: 20000 }
    VIP:     { daily: -1,       monthly: -1,        max-request: 32000 }