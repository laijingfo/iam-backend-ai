jwt:
  header: Authorization
  # 令牌前缀
  token-start-with: Token
  # 必须使用最少88位的Base64对该令牌进行编码
  base64-secret:
  # 登录会话初始有效期：1小时（配置单位毫秒，保存到 Redis 时转换为秒）
  token-validity-in-seconds: 3600000
  # 在线用户key
  online-key: online-token-
  # 剩余有效期进入30分钟窗口后，有请求访问时将会话续期
  detect: 1800000
  # 续期时间范围，默认1小时，单位秒
  renew: 3600


logging:
  config: classpath:logback-spring.xml



