server:
  port: 8088
  servlet:
    context-path: /itsc
  tomcat:
    connection-timeout: 300000

mail:
  send-enabled: ${MAIL_SEND_ENABLED:false}
  from-address: ${MAIL_FROM:uar@lenovo.com}
  from-alias: ${MAIL_FROM_NAME:Dev - User Access Review}
  username: ${MAIL_USERNAME:uar@lenovo.com}
  password: ${MAIL_PASSWORD:0}

spring:
  mvc:
    async:
      request-timeout: 300000   # 10 分钟
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ITSC_Test?stringtype=unspecified&serverTimezone=Asia/Shanghai
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
    type: com.alibaba.druid.pool.DruidDataSource

  data.redis:
    host: 127.0.0.1
    port: 6379
    database: ${REDIS_DATABASE:0}
    timeout: 3000
    password:
    lettuce:
      pool:
        max-active: 50  # 必须增大连接池
        max-idle: 16
        min-idle: 1
        max-wait: -1ms

  servlet:
    multipart:
      #上传的单个文件的最大大小，默认为 1MB
      max-file-size: 200MB
      #多文件上传时文件的总大小，默认为 10MB
      max-request-size: 200MB

mybatis-plus:
  config-location: classpath:mybatis-config.xml
  mapper-locations: classpath:mapper/*.xml

