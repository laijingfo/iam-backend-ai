      model-name: qwen3-max
      temperature: 0.7
      timeout: PT60S
      log-requests: true
      log-responses: true
  # 传输层（OkHttp）配置，由 LangChain4jConfig 读取
  http:
    # 只走 IPv4。阿里云 MaaS 域名同时下发 A/AAAA 记录，本机无 IPv6 出口时
    # OkHttp 5.x 的 happy-eyeballs 仍会尝试 IPv6，TLS 握手被中间设备 RST，
    # 表现为 SocketException: Connection reset。部署环境有可用 IPv6 时可改为 false。
    ipv4-only: true
    # 单次请求超时（秒）。langchain4j 会把它同时用作 connectTimeout 和 readTimeout，
    # 想让"连不上"类故障更快暴露可调小到 15~20。
    timeout-seconds: 120
    # 失败重试次数（仅非流式模型支持，流式模型无此配置项）
    max-retries: 3
    log-requests: true
    log-responses: true

ai:
  chat:
    enabled: true
    max-concurrent: 16
    queue-capacity: 100
    keep-alive-seconds: 60
  knowledge-router:
    refresh-minutes: 10
    retry-backoff-millis: 60000

